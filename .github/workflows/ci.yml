name: SDK checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-build:
    name: Cross-build ${{ matrix.target }} on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: arm64
          - runner: ubuntu-24.04-arm
            target: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cross-compile without target execution
        run: python tools/build_target.py --target "${{ matrix.target }}" --out build/cross
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-${{ matrix.target }}
          path: |
            build/cross/target.tar.gz
            build/cross/target.tar.gz.sha256
            build/cross/build.log
          if-no-files-found: error

  cross-run:
    name: Run transferred ${{ matrix.target }} build
    needs: cross-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cross-${{ matrix.target }}
          path: build/received
      - name: Verify and extract
        working-directory: build/received
        run: |
          sha256sum -c target.tar.gz.sha256
          tar -xzf target.tar.gz
      - name: Run the unchanged cross-built binaries on their native processor
        run: |
          python try-example.py --run-built build/received/target --exercise-demo
          python try-example.py --run-built build/received/target --language cpp --exercise-demo
          python try-example.py --run-built build/received/target --form direct --exercise-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-run-${{ matrix.target }}
          path: |
            build/received/target/*-result.json
            build/received/target/*.log
            build/received/target/cross-build.json
          if-no-files-found: error

  native:
    name: Native Linux (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libc++-dev libc++abi-dev libssl-dev openssl
      - name: Install the pinned core and product controls
        run: |
          python -c "import json,pathlib; print(json.loads(pathlib.Path('sdk/contract/origin.json').read_text())['core_head'])" > /tmp/openavc-ref
          git clone --filter=blob:none https://github.com/open-avc/openavc.git /tmp/openavc
          git -C /tmp/openavc checkout "$(cat /tmp/openavc-ref)"
          python -m pip install /tmp/openavc .
          python tools/sync_contract.py --core /tmp/openavc --check
      - name: Build and exercise C and C++
        run: |
          python doctor.py --report build/environment.json
          python try-example.py --exercise-demo
          python try-example.py --language cpp --exercise-demo
          python try-example.py --form direct --exercise-demo
          python try-example.py --checks sample/checks.json --out build/product-checks
          python new-product.py --out build/my-product
          python try-example.py --project build/my-product --build-only
          python try-example.py --project build/my-product --checks build/my-product/checks.json --out build/project-checks
          python collect-diagnostics.py --checks build/project-checks/report.json --out build/support-preview.json
          python -m unittest discover -s tests -v
      - name: Check firmware startup and service supervision
        run: |
          python examples/linux/check.py --out build/firmware-device
          python examples/linux/check.py --language cpp --out build/firmware-cpp
          python examples/linux/check.py --with-server --out build/firmware-server
          python examples/linux/check-systemd.py --with-server --out build/firmware-systemd
      - name: Build and check a supplied runtime
        run: |
          python tools/package_runtime.py --out build/package
          mkdir build/extracted
          tar -xzf build/package/openavc-sdk-linux-*.tar.gz -C build/extracted
          cd build/extracted/openavc-sdk
          python doctor.py --report build/environment.json
          python try-example.py --exercise-demo
          python try-example.py --form direct --exercise-demo
          python new-product.py --out build/my-product
          python try-example.py --project build/my-product --checks build/my-product/checks.json --out build/project-checks
          python examples/linux/check.py --with-server --out build/firmware-server
      - name: Exercise both complete arrangements
        run: |
          python try-system.py --arrangement external --out build/check-external --check
          python try-system.py --arrangement embedded --out build/check-embedded --check
      - name: Exercise five products, recovery and faults
        run: |
          python try-system.py --products 5 --arrangement external --out build/check-five-external --check --recovery --faults
          python try-system.py --products 5 --arrangement embedded --out build/check-five-embedded --check --recovery --faults
      - name: Build and install the offline server bundle
        run: |
          python tools/build_server.py --out build/server-bundle
          python -m venv build/offline-environment
          build/offline-environment/bin/python -m pip install --no-index --find-links=build/server-bundle/wheels openavc openavc-oem
          build/offline-environment/bin/python -c "from importlib.resources import files; import openavc_oem; assert files('openavc').joinpath('web/programmer/dist/index.html').is_file()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-${{ matrix.runner }}
          path: |
            build/package/*.tar.gz
            build/package/*.sha256
            build/package/build.log
            build/server-bundle/bundle.json
            build/server-bundle/*.log
            build/*-result.json
            build/host-system-logs/*.log
            build/check-*/checks.json
            build/check-*/discovery.json
            build/check-*/build.log
            build/check-*/run.json
            build/check-*/*.log
            build/product-checks/report.json
            build/project-checks/report.json
            build/support-preview.json
            build/firmware-*/report.json
            build/firmware-*/*.log
            build/extracted/openavc-sdk/build/firmware-*/report.json
            build/extracted/openavc-sdk/build/firmware-*/*.log
          if-no-files-found: ignore
