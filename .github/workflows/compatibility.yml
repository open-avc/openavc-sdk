name: Check a core revision

on:
  workflow_call:
    inputs:
      core-ref:
        description: OpenAVC commit or ref to test
        required: true
        type: string
      sdk-ref:
        description: SDK commit or ref to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: open-avc/openavc-sdk
          ref: ${{ inputs.sdk-ref }}
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: open-avc/openavc
          ref: ${{ inputs.core-ref }}
          path: core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record the tested revisions
        run: |
          mkdir -p build/compatibility
          git rev-parse HEAD > build/compatibility/sdk.txt
          git -C ../core rev-parse HEAD > build/compatibility/core.txt
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev openssl
      - name: Compare the canonical contract
        run: python tools/sync_contract.py --core ../core --check-upstream | tee build/compatibility/contract.json
      - name: Install the selected core and product controls
        run: python -m pip install ../core .
      - name: Check the adapter and host
        run: |
          python try-example.py --exercise-demo > build/compatibility/example.log 2>&1
          python -m unittest discover -s tests -v > build/compatibility/tests.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-compatibility
          path: sdk/build/compatibility/
          if-no-files-found: error
