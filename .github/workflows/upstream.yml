name: Upstream compatibility
on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev openssl
      - name: Compare the current canonical contract
        run: |
          git clone --depth 1 https://github.com/open-avc/openavc.git /tmp/openavc
          python tools/sync_contract.py --core /tmp/openavc --check-upstream
          python -m pip install /tmp/openavc .
      - name: Check the adapter and host against current core
        run: |
          python try-example.py --exercise-demo
          python -m unittest discover -s tests -v
