[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openavc-oem"
version = "0.0.0"
description = "Manufacturer equipment integration and optional OpenAVC hosting"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["aiohttp>=3.14.4,<4", "psutil>=5.9"]

[project.scripts]
openavc-oem = "openavc_oem.__main__:main"

[tool.setuptools]
packages = ["openavc_oem"]

[tool.setuptools.package-data]
openavc_oem = ["*.html"]
